services:
  - type: web
    name: velvetclap25
    runtime: node
    plan: free
    repo: https://github.com/Gautampaswan/velvetclap25
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SHOP_ORDERS_EMAIL
        sync: false
      - key: EMAIL_FROM_NAME
        value: Velvetclap25 Orders
      - key: ORDER_SMS
        sync: false
