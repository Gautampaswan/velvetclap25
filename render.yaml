services:
  - type: web
    name: velvetclap25
    runtime: node
    plan: free
    repo: https://github.com/Gautampaswan/velvetclap25
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
