<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VELVETCLAP25 — Staff catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>* { border-radius: 0 !important; }</style>
</head>
<body class="bg-[#0B0B0D] text-gray-200 min-h-screen font-sans">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-white uppercase tracking-tight">VELVETCLAP25 <span class="text-[#C6FF00]">Staff</span></h1>
    <p class="text-sm text-zinc-400 mt-1">Add shop products · Cloudinary or <code class="text-zinc-300">/products/…</code> images</p>
    <p class="text-xs text-zinc-500 mt-2"><a href="/STAFF-GUIDE.md" class="text-[#C6FF00] hover:underline">Full photo checklist (STAFF-GUIDE)</a> · <a href="/" class="hover:text-white">View store</a></p>

    <section id="login-panel" class="mt-8 border border-zinc-700 p-6 bg-[#121215] max-w-md">
      <label class="text-xs font-bold uppercase text-zinc-400">Admin password</label>
      <input id="admin-password" type="password" class="mt-2 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm text-white" placeholder="From ADMIN_PASSWORD on Render" />
      <button id="btn-login" class="mt-4 w-full bg-[#C6FF00] text-black font-bold text-sm py-2 uppercase hover:bg-white">Unlock</button>
      <p id="login-error" class="text-red-400 text-xs mt-2 hidden"></p>
    </section>

    <div id="app-panel" class="hidden mt-8 space-y-8">
      <div class="flex flex-wrap gap-3 items-center">
        <span id="product-count" class="text-sm text-zinc-400"></span>
        <button id="btn-export" class="text-xs border border-zinc-600 px-3 py-1.5 hover:border-[#C6FF00] uppercase font-bold">Export catalog JSON</button>
        <button id="btn-logout" class="text-xs text-zinc-500 hover:text-white ml-auto">Log out</button>
      </div>

      <form id="add-form" class="border border-zinc-700 p-6 bg-[#121215] space-y-4">
        <h2 class="font-bold text-white uppercase text-sm">Add product</h2>
        <div class="grid sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="text-xs text-zinc-400">Title *</label>
            <input name="title" required class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <label class="text-xs text-zinc-400">Subtitle</label>
            <input name="subtitle" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-xs text-zinc-400">Price (₹) *</label>
            <input name="price" type="number" required min="1" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-xs text-zinc-400">Original price (₹)</label>
            <input name="originalPrice" type="number" min="1" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-xs text-zinc-400">Category</label>
            <select name="category" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm">
              <option value="tees">tees</option>
              <option value="bottoms">bottoms</option>
              <option value="accessories">accessories</option>
              <option value="headwear">headwear</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-zinc-400">Fit</label>
            <select name="fit" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm">
              <option>Oversized</option>
              <option>Boxy Fit</option>
              <option>Relaxed Fit</option>
              <option>Straight Cut</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-zinc-400">Sizes (comma-separated)</label>
            <input name="sizes" value="S, M, L, XL" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-xs text-zinc-400">Stock left</label>
            <input name="stockLeft" type="number" min="0" value="10" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <label class="text-xs text-zinc-400">Color name</label>
            <input name="colorName" value="Default" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <label class="text-xs text-zinc-400">Image URL * (Cloudinary HTTPS or /products/file.jpg)</label>
            <input name="image" required placeholder="https://res.cloudinary.com/..." class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <label class="text-xs text-zinc-400">Details</label>
            <textarea name="details" rows="3" class="mt-1 w-full bg-[#0B0B0D] border border-zinc-600 px-3 py-2 text-sm"></textarea>
          </div>
        </div>
        <button type="submit" class="bg-[#C6FF00] text-black font-bold text-sm py-2.5 px-6 uppercase hover:bg-white">Add product</button>
        <p id="form-msg" class="text-xs"></p>
      </form>

      <div>
        <h2 class="font-bold text-white uppercase text-sm mb-3">Current catalog</h2>
        <ul id="product-list" class="space-y-2 text-sm"></ul>
      </div>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'vc25_admin_token';
    let token = sessionStorage.getItem(STORAGE_KEY) || '';

    function headers() {
      return { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };
    }

    async function api(path, options = {}) {
      const res = await fetch(path, { ...options, headers: { ...headers(), ...options.headers } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
      return data;
    }

    function showApp(show) {
      document.getElementById('login-panel').classList.toggle('hidden', show);
      document.getElementById('app-panel').classList.toggle('hidden', !show);
    }

    async function tryUnlock() {
      token = document.getElementById('admin-password').value;
      try {
        await api('/api/admin/products');
        sessionStorage.setItem(STORAGE_KEY, token);
        document.getElementById('login-error').classList.add('hidden');
        showApp(true);
        await loadProducts();
      } catch (e) {
        document.getElementById('login-error').textContent = e.message;
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    async function loadProducts() {
      const data = await api('/api/admin/products');
      document.getElementById('product-count').textContent = `${data.products.length} products in catalog`;
      const ul = document.getElementById('product-list');
      ul.innerHTML = data.products.map((p) => `
        <li class="flex gap-3 border border-zinc-800 p-2 bg-[#121215]">
          <img src="${p.colors[0]?.image || ''}" alt="" class="w-12 h-14 object-cover bg-black" />
          <div class="flex-1 min-w-0">
            <div class="font-bold text-white truncate">${p.title}</div>
            <div class="text-[#C6FF00] text-xs">₹${p.price} · ${p.id}</div>
          </div>
          <button type="button" data-id="${p.id}" class="btn-del text-xs text-red-400 hover:text-red-300 uppercase font-bold shrink-0">Delete</button>
        </li>
      `).join('');
      ul.querySelectorAll('.btn-del').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Remove this product from the live catalog?')) return;
          await api(`/api/admin/products/${btn.dataset.id}`, { method: 'DELETE' });
          await loadProducts();
        });
      });
    }

    document.getElementById('btn-login').addEventListener('click', tryUnlock);
    document.getElementById('admin-password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryUnlock();
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      sessionStorage.removeItem(STORAGE_KEY);
      token = '';
      showApp(false);
    });

    document.getElementById('btn-export').addEventListener('click', async () => {
      const res = await fetch('/api/admin/products/export', { headers: headers() });
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'products.json';
      a.click();
    });

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const price = Number(fd.get('price'));
      const originalPrice = Number(fd.get('originalPrice')) || Math.round(price * 2);
      const discountPct = Math.round((1 - price / originalPrice) * 100);
      const body = {
        title: fd.get('title'),
        subtitle: fd.get('subtitle') || '',
        category: fd.get('category'),
        fit: fd.get('fit'),
        price,
        originalPrice,
        discount: `${Math.max(0, discountPct)}% OFF`,
        tag: 'NEW DROP',
        tagType: 'lime',
        sizes: String(fd.get('sizes')).split(',').map((s) => s.trim()).filter(Boolean),
        stockLeft: Number(fd.get('stockLeft')) || 0,
        colors: [{ name: fd.get('colorName') || 'Default', hex: '#262626', image: fd.get('image') }],
        details: fd.get('details') || '',
        rating: 4.8,
        reviewsCount: 0,
      };
      const msg = document.getElementById('form-msg');
      try {
        await api('/api/admin/products', { method: 'POST', body: JSON.stringify(body) });
        msg.className = 'text-xs text-[#C6FF00]';
        msg.textContent = 'Product added — visible on the store now.';
        e.target.reset();
        await loadProducts();
      } catch (err) {
        msg.className = 'text-xs text-red-400';
        msg.textContent = err.message;
      }
    });

    if (token) {
      api('/api/admin/products').then(() => { showApp(true); loadProducts(); }).catch(() => {});
    }
  </script>
</body>
</html>
